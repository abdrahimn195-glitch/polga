<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f7fafc;">

    <div style="text-align: center; padding: 40px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
        
        <!-- Logo -->
        <h1 style="font-size: 2em; color: #4a5568; margin-bottom: 10px;">RateNest</h1>

        <!-- Title -->
        <h2 style="font-size: 1.5em; color: #2d3748; margin-bottom: 30px;">تسجيل الدخول</h2>

        <!-- Login Form -->
        <form action="#" method="get">
            <div style="margin-bottom: 15px; text-align: right;">
                <label for="email">البريد الإلكتروني:</label><br>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 20px; text-align: right;">
                <label for="password">كلمة المرور:</label><br>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;">
            </div>
            
            <div>
                <input type="submit" value="تسجيل الدخول" style="width: 100%; padding: 10px; background-color: #4a5568; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">
            </div>
        </form>

        <div style="margin-top: 20px;">
            <!-- Create Account Link -->
            <a href="#" style="color: #4299e1; text-decoration: none;">ليس لديك حساب؟ إنشاء حساب جديد</a>
        </div>
    </div>

</body>
</html>
